name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Copy game files into app bundle resources
        run: |
          mkdir -p ios/Game
          cp index.html scenes.js story.js engine.js ios/Game/
          cp -r assets ios/Game/assets
          ls -la ios/Game
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild build -project Jinling1937.xcodeproj -scheme Jinling1937 -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        working-directory: ios
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "APP=$APP"
          unzip -l "$APP" | grep -i "Game/" | head
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Jinling1937.ipa Payload
          ls -la Jinling1937.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Jinling1937-ipa
          path: ios/Jinling1937.ipa
